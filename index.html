<style>
:root{

}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}

.top-inner{position:relative;padding-top:18px;padding-bottom:62px}

.sync{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #F0C9A3;font-size:13px;font-weight:500;color:#8A3E07;white-space:nowrap}

/* 精選輪播（第一視覺）：左圖右文，淺色系 */
.stage{position:relative;z-index:2;margin-top:-44px}
.slide{position:relative;touch-action:pan-y;display:grid;grid-template-columns:52fr 48fr;min-height:400px;border-radius:24px;overflow:hidden;background:#fff;border:1px solid #F0E3D2;box-shadow:0 12px 32px rgba(90,60,20,.12)}
.slide-pic{position:relative;min-height:100%;background:#FFF5E1}
.slide-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.slide-pic .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slide-body{position:relative;padding:26px 30px 22px;color:var(--ink);background:#FFFBF3;display:flex;flex-direction:column;gap:10px}
.slide-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.badge-feat{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--accent-dark);color:#fff;font-size:13px;font-weight:700}
.tag-link{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;border:1.5px solid var(--teal-line);color:var(--teal);background:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tag-link:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.tag-link::after{content:"›";font-size:14px;line-height:1}
.slide-school{font-size:15px;font-weight:700;color:var(--link);text-decoration:none}
.slide-school:hover{color:#173E7A}
.slide h2{margin:0;font-size:23px;line-height:1.5;font-weight:900;color:var(--navy)}
.slide p{margin:0;font-size:17px;line-height:1.85;color:var(--body);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.slide.open p{display:block;font-size:15px;line-height:1.85}
.more-sum{align-self:flex-start;padding:0;border:none;background:none;color:var(--accent-text);font-size:14px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.slide-foot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:13px;color:var(--muted);padding-right:116px;min-height:44px}
.slide-foot a{color:var(--muted)}
.nav-btn{position:absolute;bottom:22px;z-index:3;width:46px;height:46px;border-radius:999px;border:1.5px solid #F0C9A3;background:#fff;color:var(--accent-text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.nav-btn.next{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.nav-btn.prev{right:84px} .nav-btn.next{right:28px}
.dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
.dots button{width:28px;height:28px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dots span{display:block;height:8px;width:8px;border-radius:999px;background:#C9D2DE}
.dots button[aria-current="true"] span{width:22px;background:var(--accent-dark)}

/* 搜尋 */
.panel{margin-top:14px;background:#fff;border-radius:18px;border:1px solid #F0E3D2;box-shadow:0 6px 24px rgba(90,60,20,.08);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;gap:12px;align-items:flex-start}
.search-box{position:relative;flex:1 1 auto;min-width:0}
.search-field{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:1.5px solid var(--accent);border-radius:10px;background:#fff}
.search-field input{flex:1;min-width:0;height:46px;border:none;outline:none;font-size:16px;font-family:inherit;color:var(--ink);background:transparent}
.search-field input::placeholder{color:#7A8594}
.icon-btn{width:32px;height:32px;border:none;border-radius:999px;background:#EEF1F5;color:#4A5562;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sugs{position:absolute;left:0;right:0;top:56px;z-index:10;background:#fff;border:1px solid #E1E7EE;border-radius:12px;box-shadow:0 10px 24px rgba(20,40,70,.14);padding:6px;display:flex;flex-direction:column}
.sugs button{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:none;border-radius:8px;background:#fff;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.sugs button:hover{background:#FFF5E1}
.sugs small{font-size:13px;color:var(--muted)}
.btn-primary{height:50px;padding:0 34px;border:none;border-radius:10px;background:var(--accent-dark);color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex:none}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.chips span{color:var(--muted)}
.chip{min-height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--teal-line);background:#fff;color:var(--teal);font-size:14px;font-weight:500;cursor:pointer}

/* 從主題看大學特色 */
.topics{margin-top:48px}
.sec-title{margin:0 0 16px;font-size:24px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:10px}
.sec-title::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--accent)}
.cat-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.cat{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:96px;padding:16px;border-radius:16px;cursor:pointer;border:2px solid transparent;text-align:left}
.cat:nth-child(odd){background:#FFF5E1} .cat:nth-child(even){background:#E6F2FB}
.cat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 4px 14px rgba(240,122,31,.18)}
.cat .txt{display:flex;flex-direction:column;gap:4px}
.cat .name{font-size:18px;font-weight:700;color:var(--navy)}
.cat[aria-pressed="true"] .name{color:var(--accent-text)}
.cat .count{font-size:13px;font-weight:500;color:var(--muted)}
.cat .art{flex:none;width:56px;height:56px}
.cat-dock{display:none}
.where{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px;padding:12px 16px;border-radius:12px;background:#FFF5E1;border:1px solid #F0E3D2;font-size:14px;color:var(--muted)}
.where a{color:var(--link)}
.where strong{color:var(--navy)}
.where-back{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--accent);background:#fff;color:var(--accent-text);font-size:14px;font-weight:700;cursor:pointer}

/* 文章列表 */
.list-sec{background:var(--sky);margin-top:48px}
.list-inner{padding-top:48px;padding-bottom:72px;display:flex;flex-direction:column;gap:24px}
.list-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.list-head h2{margin:0;font-size:28px;font-weight:900;color:var(--navy)}
.list-desc{margin:0;max-width:720px;font-size:15.5px;line-height:1.8;color:#4A5562}
.list-desc:empty{display:none}
.list-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;font-size:14px;color:#4A5562}
.pill-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #9CC6E4;background:#fff;color:var(--link);font-size:13px;font-weight:500;cursor:pointer}
.notice{background:#fff;border:1.5px dashed #9CC6E4;border-radius:16px;padding:28px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px;color:#4A5562;font-size:15px;line-height:1.8}
.notice strong{color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:32px}
.card{display:flex;flex-direction:column;background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 12px rgba(20,40,70,.05)}
.media{position:relative;aspect-ratio:3/2;display:block;overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;transition:transform .4s ease}
.card:hover .media img{transform:scale(1.03)}
.media .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.media .chip-on{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.media .chip-on a{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--teal);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.media .chip-on a::after{content:"›";font-size:13px;line-height:1}
.media .chip-on a:hover{background:var(--teal);color:#fff}
.new{position:absolute;left:14px;top:14px;padding:3px 10px;border-radius:6px;background:var(--accent-dark);color:#fff;font-size:12px;font-weight:900;letter-spacing:.06em}
.card-body{padding:22px 26px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.school{font-size:15px;font-weight:700;color:var(--link);text-decoration:none}
.school small{font-weight:500;font-size:12px;margin-left:6px}
.date{font-size:13px;color:var(--muted)}
.card h3{margin:0;font-size:21px;line-height:1.55;font-weight:900;color:var(--navy)}
.card p{margin:0;font-size:15.5px;line-height:1.95;color:var(--body)}
.source{margin-top:auto;padding-top:10px;align-self:flex-end;font-size:13px;color:var(--muted)}
.more-row{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:#4A5562}
.btn-more{height:48px;padding:0 40px;border-radius:10px;border:none;background:var(--accent-dark);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.status{text-align:center;color:#4A5562;font-size:15px;padding:40px 0;margin:0}
footer{background:var(--navy);color:#D3DCE8;font-size:13px}
footer .wrap{padding-top:28px;padding-bottom:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

/* 主題模式：點了主題後只顯示主題按鈕與文章；按回頁首時再顯示標題與搜尋，但不顯示輪播 */
body.mode-focus #featured{display:none}
body.mode-compact .top,body.mode-compact .panel{display:none}
body.mode-focus .stage{margin-top:-44px}
body.mode-focus .panel{margin-top:0}
body.mode-compact .stage{margin-top:0;padding-top:24px}
body.mode-compact .topics{margin-top:0}
.to-top{position:fixed;right:24px;bottom:24px;z-index:20;display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 18px;border:none;border-radius:999px;background:var(--accent-dark);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.to-top.show{opacity:1;transform:none;pointer-events:auto}

@media (max-width:900px){
  .to-top{right:16px;bottom:16px;padding:0 14px;height:44px}
  .top .deco{display:none}
  .top h1{font-size:26px}
  .top-inner{padding-top:16px;padding-bottom:56px}
  .stage{margin-top:-40px}
  .slide{grid-template-columns:1fr;min-height:0;border-radius:18px}
  .slide-pic{aspect-ratio:16/9}
  .slide-body{padding:18px 18px 16px;gap:8px}
  .slide h2{font-size:19px}
  .slide p{font-size:15.5px;-webkit-line-clamp:5}
  .slide.open p{font-size:14.5px}
  .slide-foot{padding-right:0;min-height:0}
  .nav-btn{display:none}
  .panel{padding:14px;margin-top:12px}
  .btn-primary{padding:0 18px}
  .topics{margin-top:32px}
  .topics .cat-row{display:none}
  .cat-dock{display:block;position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid #E6EBF1;box-shadow:0 4px 10px rgba(20,40,70,.06)}
  .cat-dock .cat-row{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
  .cat-dock .cat{flex:0 0 auto;min-height:42px;padding:0 16px;border-radius:999px;background:#fff !important;border:1.5px solid #C9D2DE}
  .cat-dock .cat[aria-pressed="true"]{background:var(--accent-dark) !important;border-color:var(--accent-dark);box-shadow:none}
  .cat-dock .cat[aria-pressed="true"] .name,.cat-dock .cat[aria-pressed="true"] .count{color:#fff}
  .cat-dock .cat .art{display:none}
  .cat-dock .cat .txt{flex-direction:row;align-items:baseline;gap:6px}
  .cat-dock .cat .name{font-size:15px}
  .card-body{padding:18px 18px 16px}
  .card h3{font-size:18px}
  .list-sec{margin-top:32px}
}
@media (max-width:1100px) and (min-width:901px){ .cat-row{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ .media img{transition:none} }
</style>
</head>

        <button type="button" class="where-back" id="whereBack"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>回大學亮點首頁</button>
      </nav>
      <h2 class="sec-title" id="topicsTitle">從主題看大學特色</h2>
      <div class="cat-row" id="cats" role="group" aria-labelledby="topicsTitle"></div>
    </section>
  </div>

  <div class="cat-dock" id="catDock"></div>

  <section class="list-sec" aria-labelledby="listTitle">
    <div class="wrap list-inner">
      <div class="list-head">
        <h2 id="listTitle">最新亮點文章</h2>
        <p class="list-desc" id="listDesc"></p>
        <div class="list-meta">
          <span id="listMeta"></span>
          <button type="button" class="pill-btn" id="showAll" hidden>看全部文章</button>
          <button type="button" class="pill-btn" id="copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1 1"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1-1"/></svg><span>複製此頁連結</span></button>
        </div>
      </div>
      <div class="notice" id="notice" hidden></div>
      <p class="status" id="status">文章載入中…</p>
      <div class="grid" id="grid"></div>
      <div class="more-row"><span id="progress"></span><button type="button" class="btn-more" id="more" hidden>顯示更多文章</button></div>
    </div>
  </section>
</main>

<button type="button" class="to-top" id="toTop" aria-label="回到頁首"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>回頁首</button>

<footer><div class="wrap"><span>文章內容由 104職場力〈大學校園〉提供</span><span>104 Corporation © <span id="year"></span></span></div></footer>
<script>
(function () {
  'use strict';

  /* ====== 設定區：只需改這裡 ====== */
  var GA_ID = '';            // Google Analytics 評估 ID（G- 開頭），沒有就留空
  var PAGE_SIZE = 9;         // 每次顯示幾篇
  var NEW_DAYS = 7;          // 幾天內算新文章
  var SLIDE_SECONDS = 8;     // 精選輪播切換秒數
  var FEATURED_MAX = 5;      // 輪播固定幾則：先放勾選精選的，不足就用最新文章補滿
  /* ================================ */

  var ALL_DESC = '彙整各大學在國際交流、社會實踐、淨零永續與 AI 發展的亮點，以及學校專訪。';
  var CATS = [
    { id: 'intl', name: '國際交流', desc: '台灣學生到海外交換實習、外籍生來台就學、學校跨國合作與姊妹校交流，看大學如何培養學生的國際移動力。' },
    { id: 'usr',  name: 'USR計畫',  desc: '大學走出校園、深耕在地，透過地方創生、偏鄉教育、社區與部落合作及高齡關懷，實踐大學社會責任。' },
    { id: 'net0', name: '淨零永續', desc: '聚焦綠領人才培育，以及淨零減碳、循環經濟與綠能研究，推動永續校園行動。' },
    { id: 'ai',   name: 'AI發展',   desc: '從半導體與晶片人才培育、AI 課程與跨域應用，看大學如何接軌科技趨勢。' },
    { id: 'talk', name: '學校專訪', desc: '走進校園，透過校長分享辦學理念、學校特色與學習路徑，更認識各大專校院。' }
  ];
  var NAME_TO_ID = {}; CATS.forEach(function (c) { NAME_TO_ID[c.name] = c.id; });

  var ART = {
    all: '<path d="M8 18 C18 13 27 15 32 20 C37 15 46 13 56 18 V50 C46 45 37 47 32 52 C27 47 18 45 8 50 Z" fill="#FFE9C7" stroke="#1D3A63" stroke-width="2.5" stroke-linejoin="round"/><line x1="32" y1="20" x2="32" y2="52" stroke="#1D3A63" stroke-width="2.5"/><path d="M52 4 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 z" fill="#F5A15A"/>',
    intl: '<circle cx="30" cy="36" r="20" fill="#6DB6E8" stroke="#1D3A63" stroke-width="2.5"/><ellipse cx="30" cy="36" rx="9" ry="20" fill="none" stroke="#1D3A63" stroke-width="2"/><line x1="10" y1="36" x2="50" y2="36" stroke="#1D3A63" stroke-width="2"/><path d="M44 12 L60 6 L54 22 L50 16 Z" fill="#F5A15A" stroke="#1D3A63" stroke-width="2" stroke-linejoin="round"/>',
    usr: '<path d="M8 32 L32 12 L56 32" fill="none" stroke="#1D3A63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="30" width="36" height="24" rx="2" fill="#FFD25C" stroke="#1D3A63" stroke-width="2.5"/><path d="M32 49 C25 44 22 41 22 38 A5 5 0 0 1 32 36 A5 5 0 0 1 42 38 C42 41 39 44 32 49 Z" fill="#E8613C"/>',
    net0: '<circle cx="16" cy="16" r="7" fill="#FFD25C"/><path d="M12 54 C12 30 28 16 54 12 C54 36 40 54 12 54 Z" fill="#7CC7A0" stroke="#1D3A63" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 52 L42 24" stroke="#1D3A63" stroke-width="2" stroke-linecap="round"/>',
    ai: '<g stroke="#1D3A63" stroke-width="2.5" stroke-linecap="round"><line x1="24" y1="8" x2="24" y2="16"/><line x1="32" y1="8" x2="32" y2="16"/><line x1="40" y1="8" x2="40" y2="16"/><line x1="24" y1="48" x2="24" y2="56"/><line x1="32" y1="48" x2="32" y2="56"/><line x1="40" y1="48" x2="40" y2="56"/><line x1="8" y1="24" x2="16" y2="24"/><line x1="8" y1="40" x2="16" y2="40"/><line x1="48" y1="24" x2="56" y2="24"/><line x1="48" y1="40" x2="56" y2="40"/></g><rect x="16" y="16" width="32" height="32" rx="5" fill="#6DB6E8" stroke="#1D3A63" stroke-width="2.5"/><rect x="25" y="25" width="14" height="14" rx="2" fill="#FFD25C" stroke="#1D3A63" stroke-width="2"/>',
    talk: '<rect x="22" y="8" width="20" height="32" rx="10" fill="#F5A15A" stroke="#1D3A63" stroke-width="2.5"/><line x1="26" y1="18" x2="38" y2="18" stroke="#1D3A63" stroke-width="2"/><line x1="26" y1="25" x2="38" y2="25" stroke="#1D3A63" stroke-width="2"/><path d="M14 30 C14 42 22 48 32 48 C42 48 50 42 50 30" fill="none" stroke="#1D3A63" stroke-width="2.5" stroke-linecap="round"/><line x1="32" y1="48" x2="32" y2="56" stroke="#1D3A63" stroke-width="2.5"/><line x1="22" y1="56" x2="42" y2="56" stroke="#1D3A63" stroke-width="2.5" stroke-linecap="round"/>'
  };
  var TINT = { intl: '#DCEEFA', usr: '#FFE6DC', net0: '#E3F4EA', ai: '#FFF0D6', talk: '#E6F2FB', all: '#FFF5E1' };
  var BRAND_HOME = 'https://guide.104.com.tw/career/college-brand/';

  var data = { articles: [], schools: [] };
  var state = { cat: 'all', school: null, text: '', shown: PAGE_SIZE, slide: 0, compact: false };
  var timer = null;
  var userControls = false;   // 讀者摸過輪播後就不再自動切換，由讀者自己控制
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 小工具 ---------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'className') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function svgArt(key, size) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 64 64'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ART[key] || ART.all;
    return s;
  }
  function safeUrl(u, prefixes) { u = String(u || ''); return prefixes.some(function (p) { return u.indexOf(p) === 0; }) ? u : ''; }
  function norm(s) { return String(s || '').replace(/台/g, '臺').replace(/\s/g, '').toLowerCase(); }
  function track(name, params) { if (window.gtag) window.gtag('event', name, params || {}); }
  function catIds(a) { return a.cats.map(function (c) { return NAME_TO_ID[c]; }).filter(Boolean); }
  function isNew(a) { return (Date.now() - new Date(a.date + 'T00:00:00+08:00').getTime()) / 86400000 <= NEW_DAYS; }
  function fmtDate(d) { return d.replace(/-/g, '.'); }

  // 圖片：讀不到就顯示分類插圖
  // 職場力圖片網址結尾的「-768x512」是縮圖尺寸，去掉就是原圖
  function fullSize(u) { return u.replace(/-\d+x\d+(\.(jpe?g|png|webp))$/i, '$1'); }
  function picture(a, size, bg, hiRes) {
    var key = catIds(a)[0] || 'all';
    var frag = document.createDocumentFragment();
    var fb = el('span', { className: 'fallback' }, [svgArt(key, size)]);
    if (bg) fb.style.background = bg === 'tint' ? TINT[key] : bg;
    frag.appendChild(fb);
    if (a.image) {
      var src = hiRes ? (a.imageFull || fullSize(a.image)) : a.image;
      var img = el('img', { src: src, alt: '', loading: hiRes ? 'eager' : 'lazy', decoding: 'async', referrerpolicy: 'no-referrer' });
      img.addEventListener('error', function () {
        if (img.getAttribute('src') !== a.image) img.setAttribute('src', a.image);   // 原圖讀不到就退回縮圖
        else img.remove();
      });
      frag.appendChild(img);
    }
    return frag;
  }

  /* ---------- Google Analytics（有填 ID 才載入） ---------- */
  if (/^G-[A-Z0-9]+$/.test(GA_ID)) {
    var gs = document.createElement('script'); gs.async = true;
    gs.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(gs);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    window.gtag('js', new Date()); window.gtag('config', GA_ID);
  }

  function schoolLink(a, cls) {
    if (!a.school) return null;
    var link = el('a', { className: cls || 'school', href: a.brandUrl || BRAND_HOME, target: '_blank', rel: 'noopener' }, [a.school, cls ? null : el('small', { text: '看品牌力 →' })]);
    link.addEventListener('click', function () { track('brand_click', { school: a.school }); });
    return link;
  }
  function sourceLink(a, cls) {
    var link = el('a', { className: cls || 'source', href: a.url, target: '_blank', rel: 'noopener', text: '職場力原文 ↗' });
    link.addEventListener('click', function () { track('article_click', { school: a.school, title: a.title }); });
    return link;
  }

  /* ---------- 精選大圖輪播 ---------- */
  function featList() {
    var picked = data.articles.filter(function (a) { return a.featured; });
    var rest = data.articles.filter(function (a) { return !a.featured && a.image; });   // 補位優先用有圖的最新文章
    return picked.concat(rest).slice(0, FEATURED_MAX);
  }
  function renderFeatured() {
    var list = featList();
    $('featured').hidden = !list.length;
    if (!list.length) return;
    var n = list.length, i = ((state.slide % n) + n) % n, a = list[i];
    var slide = el('article', { className: 'slide', 'aria-roledescription': '投影片', 'aria-label': (i + 1) + ' / ' + n });
    var pic = el('div', { className: 'slide-pic' }); pic.appendChild(picture(a, 140, 'tint', true));
    slide.appendChild(pic);
    var moreBtn = el('button', { type: 'button', className: 'more-sum', 'aria-expanded': 'false', text: '看完整摘要' });
    moreBtn.addEventListener('click', function () {
      var open = slide.classList.toggle('open');
      moreBtn.textContent = open ? '收合摘要' : '看完整摘要';
      moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      clearInterval(timer);                       // 讀摘要時暫停自動輪播
    });
    var meta = el('div', { className: 'slide-meta' }, [el('span', { className: 'badge-feat', text: a.featured ? '精選文章' : '最新文章' })]);
    a.cats.forEach(function (c) { meta.appendChild(topicLink(c, 'tag-link')); });
    slide.appendChild(el('div', { className: 'slide-body' }, [
      meta,
      schoolLink(a, 'slide-school'),
      el('h2', { text: a.title }),
      el('p', { text: a.summary }),
      moreBtn,
      el('div', { className: 'slide-foot' }, [el('span', { text: fmtDate(a.date) }), sourceLink(a, 'slide-src')])
    ]));
    var box = $('slide'); box.textContent = ''; box.appendChild(slide);
    var para = slide.querySelector('p');
    if (para.scrollHeight <= para.clientHeight + 2) moreBtn.hidden = true;     // 摘要本來就很短時不顯示「看完整摘要」
    $('prev').hidden = $('next').hidden = n < 2;

    var dots = $('dots'); dots.textContent = '';
    if (n > 1) list.forEach(function (x, k) {
      var d = el('button', { type: 'button', 'aria-label': '第 ' + (k + 1) + ' 則精選', 'aria-current': k === i ? 'true' : 'false' }, [el('span')]);
      d.addEventListener('click', function () { state.slide = k; renderFeatured(); restartTimer(); });
      dots.appendChild(d);
    });
  }
  function restartTimer() {
    clearInterval(timer);
    if (userControls || window.matchMedia('(prefers-reduced-motion: reduce)').matches || featList().length < 2) return;
    timer = setInterval(function () { state.slide++; renderFeatured(); }, SLIDE_SECONDS * 1000);
  }

  /* ---------- 版面模式 ---------- */
  // 首頁：橫幅＋輪播＋搜尋＋主題＋文章
  // 選了主題、搜尋學校：不顯示輪播；從主題進入時再隱藏橫幅與搜尋（compact），按回頁首才顯示
  function applyMode() {
    var focus = state.cat !== 'all' || !!state.school || !!state.text;
    document.body.classList.toggle('mode-focus', focus);
    document.body.classList.toggle('mode-compact', focus && state.compact);
    if (focus) clearInterval(timer); else restartTimer();
  }
  function toTop(smooth) { window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' }); }
  // 每次切換主題或搜尋都記成瀏覽紀錄的一步，按瀏覽器「上一頁」就回到前一個畫面
  function hashFor(cat) { return location.pathname + location.search + (cat === 'all' ? '' : '#' + cat); }
  function navigate(next, push) {
    state.cat = next.cat || 'all'; state.school = next.school || null; state.text = next.text || '';
    state.compact = !!next.compact; state.shown = PAGE_SIZE;
    var snap = { cat: state.cat, school: state.school, text: state.text, compact: state.compact };
    if (push) history.pushState(snap, '', hashFor(state.cat)); else history.replaceState(snap, '', hashFor(state.cat));
    $('q').value = state.school || state.text || ''; $('clear').hidden = !$('q').value; hideSugs();
    renderCats(); renderList(); applyMode(); renderWhere();
  }
  function renderWhere() {
    var c = CATS.filter(function (x) { return x.id === state.cat; })[0];
    var now = state.school ? state.school : state.text ? '搜尋「' + state.text + '」' : c ? c.name : '';
    $('where').hidden = !now;
    $('whereNow').textContent = now;
  }
  function openTopic(id, from) {
    navigate({ cat: id, compact: true }, true);
    toTop(false);
    var c = CATS.filter(function (x) { return x.id === id; })[0];
    if (c) track('select_category', { category: c.name, from: from || 'topics' });
  }
  function goHome() { navigate({}, true); toTop(false); }
  function topicLink(name, cls) {
    var id = NAME_TO_ID[name];
    var t = el('a', { className: cls, href: '#' + id, title: '看更多「' + name + '」文章', text: name });
    t.addEventListener('click', function (e) { e.preventDefault(); openTopic(id, cls); });
    return t;
  }

  /* ---------- 從主題看大學特色 ---------- */
  function renderCats() {
    var box = $('cats'); box.textContent = '';
    CATS.forEach(function (c) {
      var n = data.articles.filter(function (a) { return catIds(a).indexOf(c.id) !== -1; }).length;
      var on = c.id === state.cat && !state.school && !state.text;
      var b = el('button', { type: 'button', className: 'cat', 'aria-pressed': on ? 'true' : 'false' }, [
        el('span', { className: 'txt' }, [el('span', { className: 'name', text: c.name }), el('span', { className: 'count', text: n ? n + ' 篇' : '近期無新文章' })]),
        el('span', { className: 'art' }, [svgArt(c.id, 56)])
      ]);
      b.addEventListener('click', function () { if (on) goHome(); else openTopic(c.id, 'topics'); });
      box.appendChild(b);
    });
  }
  /* ---------- 搜尋 ---------- */
  function matchSchools(q) {
    var n = norm(q); if (!n) return [];
    function rank(s) {
      var al = (s.alias || []).map(norm), nm = norm(s.name), short = nm.replace(/^國立/, '');
      if (al.some(function (x) { return x.indexOf(n) === 0 || (x.length >= 2 && n.indexOf(x) === 0); })) return 0;
      if (short.indexOf(n) === 0) return 1;
      if (nm.indexOf(n) !== -1 || al.some(function (x) { return x.indexOf(n) !== -1; })) return 2;
      return -1;
    }
    return data.schools.map(function (s) { return { s: s, r: rank(s) }; })
      .filter(function (x) { return x.r >= 0; }).sort(function (a, b) { return a.r - b.r; }).map(function (x) { return x.s; });
  }
  function countBySchool(name) { return data.articles.filter(function (a) { return a.school === name; }).length; }
  function showSugs() {
    var list = matchSchools($('q').value).slice(0, 6);
    var box = $('sugs'); box.textContent = '';
    if (!list.length) { box.hidden = true; return; }
    list.forEach(function (s) {
      var n = countBySchool(s.name);
      var b = el('button', { type: 'button', role: 'option' }, [el('span', { text: s.name }), el('small', { text: n ? n + ' 篇文章' : '尚無文章' })]);
      b.addEventListener('click', function () { pickSchool(s.name); });
      box.appendChild(b);
    });
    box.hidden = false;
  }
  function hideSugs() { $('sugs').hidden = true; }
  function pickSchool(name) {
    navigate({ school: name }, true);
    track('search', { search_term: name });
    $('listTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function commitSearch() {
    var q = $('q').value.trim(); if (!q) return;
    var list = matchSchools(q);
    if (list.length) { pickSchool(list[0].name); return; }
    navigate({ text: q }, true);
    track('search', { search_term: q });
    $('listTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- 文章列表 ---------- */
  function card(a) {
    var m = el('div', { className: 'media' });
    m.appendChild(picture(a, 84, 'tint'));
    if (isNew(a)) m.appendChild(el('span', { className: 'new', text: 'NEW' }));
    m.appendChild(el('div', { className: 'chip-on' }, a.cats.map(function (c) { return topicLink(c, 'chip-link'); })));
    return el('article', { className: 'card' }, [
      m,
      el('div', { className: 'card-body' }, [
        el('div', { className: 'meta-row' }, [schoolLink(a), el('span', { className: 'date', text: fmtDate(a.date) })]),
        el('h3', { text: a.title }),
        el('p', { text: a.summary }),
        sourceLink(a)
      ])
    ]);
  }
  function renderList() {
    var items, title, empty = '', desc = '';
    if (state.school) {
      items = data.articles.filter(function (a) { return a.school === state.school; });
      title = state.school + ' 的亮點文章';
      if (!items.length) empty = '目前還沒有' + state.school + '的相關文章，新文章上架後會自動出現在這裡。';
    } else if (state.text) {
      var t = norm(state.text);
      items = data.articles.filter(function (a) { return norm(a.school + a.title).indexOf(t) !== -1; });
      title = '「' + state.text + '」的搜尋結果';
      if (!items.length) empty = '找不到「' + state.text + '」的相關文章，請試試其他校名或簡稱。';
    } else if (state.cat === 'all') {
      var inSlides = featList().map(function (x) { return x.url; });
      items = data.articles.filter(function (x) { return inSlides.indexOf(x.url) === -1; });   // 首頁列表不重複輪播中的文章
      title = '更多亮點文章'; desc = ALL_DESC;
    } else {
      var c = CATS.filter(function (x) { return x.id === state.cat; })[0];
      items = data.articles.filter(function (a) { return catIds(a).indexOf(state.cat) !== -1; });
      title = c.name; desc = c.desc;
      if (!items.length) empty = '「' + c.name + '」近期沒有新文章，職場力上架相關文章後會自動出現在這裡。';
    }
    $('listTitle').textContent = title;
    $('listDesc').textContent = desc;
    $('showAll').hidden = state.cat === 'all' && !state.school && !state.text;
    var notice = $('notice');
    if (empty) {
      notice.textContent = '';
      notice.appendChild(svgArt('all', 64));
      notice.appendChild(el('span', {}, [empty, el('br'), el('strong', { text: '先看看其他最新文章：' })]));
      notice.hidden = false;
      items = data.articles.slice(0, 3);
      $('listMeta').textContent = '推薦閱讀';
    } else {
      notice.hidden = true;
      $('listMeta').textContent = '依上架日期排序，共 ' + items.length + ' 篇';
    }
    var grid = $('grid'); grid.textContent = '';
    var visible = items.slice(0, state.shown);
    visible.forEach(function (a) { grid.appendChild(card(a)); });
    $('more').hidden = !(!empty && items.length > visible.length);
    $('progress').textContent = empty || !items.length ? '' : '已顯示 ' + visible.length + '／' + items.length + ' 篇';
  }

  /* ---------- 熱門搜尋：近期文章最多的學校 ---------- */
  function renderChips() {
    var count = {};
    data.articles.slice(0, 60).forEach(function (a) { if (a.school) count[a.school] = (count[a.school] || 0) + 1; });
    var top = Object.keys(count).sort(function (x, y) { return count[y] - count[x]; }).slice(0, 5);
    var box = $('chips');
    if (!top.length) { box.hidden = true; return; }
    top.forEach(function (name) {
      var s = data.schools.filter(function (x) { return x.name === name; })[0];
      var label = s && s.alias && s.alias[0] ? s.alias[0] : name;
      var b = el('button', { type: 'button', className: 'chip', text: label });
      b.addEventListener('click', function () { pickSchool(name); });
      box.appendChild(b);
    });
  }

  /* ---------- 事件 ---------- */
  $('q').addEventListener('input', function () { $('clear').hidden = !this.value; showSugs(); });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitSearch(); }
    if (e.key === 'Escape') hideSugs();
  });
  $('go').addEventListener('click', commitSearch);
  $('clear').addEventListener('click', function () { navigate({}, true); $('q').focus(); });
  $('showAll').addEventListener('click', goHome);
  $('whereBack').addEventListener('click', goHome);
  $('whereHome').addEventListener('click', function (e) { e.preventDefault(); goHome(); });
  // 回頁首：主題模式下改為顯示標題與搜尋，輪播仍不顯示
  $('toTop').addEventListener('click', function () { state.compact = false; applyMode(); toTop(true); track('back_to_top', {}); });
  window.addEventListener('scroll', function () { $('toTop').classList.toggle('show', window.scrollY > 500); }, { passive: true });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search-box')) hideSugs(); });
  $('more').addEventListener('click', function () { state.shown += PAGE_SIZE; renderList(); });
  $('prev').addEventListener('click', function () { state.slide--; renderFeatured(); restartTimer(); });
  $('next').addEventListener('click', function () { state.slide++; renderFeatured(); restartTimer(); });
  // 手機：左右滑動切換輪播；手指一碰到輪播就停止自動播放
  var sx = 0, sy = 0;
  $('slide').addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    userControls = true; clearInterval(timer);
  }, { passive: true });
  $('slide').addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      state.slide += dx < 0 ? 1 : -1; renderFeatured();
      track('carousel_swipe', {});
    }
  }, { passive: true });
  $('featured').addEventListener('mouseenter', function () { clearInterval(timer); });
  $('featured').addEventListener('mouseleave', restartTimer);
  $('featured').addEventListener('focusin', function () { clearInterval(timer); });
  $('copy').addEventListener('click', function () {
    var label = this.querySelector('span');
    var done = function () { label.textContent = '已複製連結'; setTimeout(function () { label.textContent = '複製此頁連結'; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, function () {}); else done();
    track('share_link', { category: state.cat });
  });
  // 按瀏覽器上一頁／下一頁，或手動改網址的 #主題
  window.addEventListener('popstate', function (e) {
    var snap = e.state;
    if (!snap) { var id = location.hash.slice(1); snap = { cat: CATS.some(function (c) { return c.id === id; }) ? id : 'all' }; }
    navigate(snap, false);
    toTop(false);
  });
  $('year').textContent = new Date().getFullYear();

  // 手機版：主題列移到可固定在頂端的位置
  var mq = window.matchMedia('(max-width: 900px)');
  function placeCats() { (mq.matches ? $('catDock') : document.querySelector('.topics')).appendChild($('cats')); }
  if (mq.addEventListener) mq.addEventListener('change', placeCats); else mq.addListener(placeCats);
  placeCats();

  /* ---------- 載入資料 ---------- */
  var bust = Math.floor(Date.now() / 600000);
  fetch('data.json?v=' + bust, { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (json) {
      var ARTICLE = ['https://blog.104.com.tw/'];
      // 圖片：優先用複製到本站 images 資料夾的版本，沒有才用職場力原圖
      var img = function (u) { u = String(u || ''); return /^images\/[\w-]+\.(jpg|png|webp)$/.test(u) ? u : safeUrl(u, ARTICLE); };
      data.schools = Array.isArray(json.schools) ? json.schools : [];
      data.articles = (Array.isArray(json.articles) ? json.articles : []).map(function (a) {
        return {
          title: String(a.title || ''), summary: String(a.summary || '').slice(0, 260),
          date: /^\d{4}-\d{2}-\d{2}$/.test(a.date) ? a.date : '',
          url: safeUrl(a.url, ARTICLE), image: img(a.image), imageFull: img(a.imageFull),
          school: String(a.school || ''), brandUrl: safeUrl(a.brandUrl, ['https://guide.104.com.tw/']),
          cats: Array.isArray(a.cats) ? a.cats.map(String).filter(function (c) { return NAME_TO_ID[c]; }) : [],
          featured: a.featured === true
        };
      }).filter(function (a) { return a.title && a.url && a.date; })
        .sort(function (x, y) { return x.date < y.date ? 1 : x.date > y.date ? -1 : 0; });
      $('status').hidden = true;
      var h = location.hash.slice(1);
      renderChips(); renderFeatured();
      navigate({ cat: CATS.some(function (c) { return c.id === h; }) ? h : 'all' }, false);   // 從分享連結進來：保留標題與搜尋，只隱藏輪播
    })
    .catch(function () { $('status').textContent = '文章暫時無法載入，請稍後重新整理頁面。'; });
})();
</script>
</body>
</html>
